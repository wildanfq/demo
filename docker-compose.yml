services:
  app:
    container_name: task
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/tasks?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    container_name: task-db
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata-dev:
